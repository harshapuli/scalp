<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5">
<title>scalp 2 — trades</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#141413; --bg:#faf9f5; --panel:#fff; --hair:#e8e6dc;
    --dim:#6b6a65; --mid:#b0aea5;
    --accent:#d97757; --accent-soft:#fceee7;
    --bull:#3d7c5e; --bear:#b03528;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:13px/1.4 'Lora',Georgia,serif; background:var(--bg); color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom); }
  h2, .poppins { font-family:'Poppins',Arial,sans-serif; letter-spacing:-.01em; }

  .topnav { position:sticky; top:0; z-index:20; display:flex; gap:4px;
    padding:8px 10px; background:var(--bg); border-bottom:1px solid var(--hair); }
  .topnav a { font-family:'Poppins',Arial,sans-serif; display:inline-flex; align-items:center; gap:5px;
    padding:7px 12px; font-size:12px; font-weight:500; color:var(--dim); text-decoration:none;
    border-radius:999px; border:1px solid transparent; }
  .topnav a.active { color:var(--ink); background:var(--accent-soft); border-color:rgba(217,119,87,0.3); }
  .topnav a .sub { font-size:10px; color:var(--mid); font-weight:400; }
  .topnav a.active .sub { color:var(--accent); }

  main { max-width:1100px; margin:0 auto; padding:8px 10px 24px; }

  .status { font-family:'Poppins',Arial,sans-serif; font-size:11px; color:var(--dim);
    padding:4px 4px 10px; }
  .status .dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
  .status .dot.on { background:var(--bull); animation:pulse 1.5s infinite; }
  .status .dot.off { background:var(--mid); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

  /* Cards in a responsive grid: 2 cols on desktop, 1 on mobile */
  .grid { display:grid; gap:10px; grid-template-columns:1fr; }
  @media (min-width:680px) { .grid { grid-template-columns:1fr 1fr; } }

  .card { background:var(--panel); border:1px solid var(--hair); border-radius:10px;
    padding:12px 14px; }
  .card.trade { border-color:rgba(217,119,87,.5); box-shadow:0 3px 10px rgba(217,119,87,.12); }

  .card-head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tick { font-family:'Poppins',Arial,sans-serif; font-size:18px; font-weight:700; color:var(--ink); }
  .stage { font-family:'Poppins',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:.05em;
    padding:3px 7px; border-radius:3px; text-transform:uppercase; }
  .stage.forming { background:#dbeafe; color:#1e3a8a; }
  .stage.trade { background:linear-gradient(135deg, var(--accent), #e88e6f); color:#fff; }
  .strat, .dir { font-family:'Poppins',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:.05em;
    padding:3px 7px; border-radius:3px; }
  .strat { background:var(--accent-soft); color:var(--accent); }
  .dir.long { background:linear-gradient(135deg, var(--bull), #4d9b75); color:#fff; }
  .dir.short { background:linear-gradient(135deg, var(--bear), #d04638); color:#fff; }

  .plan { display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    background:#f7f6ef; border-radius:6px; padding:8px;
    font-family:'Poppins',Arial,sans-serif; font-variant-numeric:tabular-nums; }
  .plan > div { display:flex; flex-direction:column; }
  .plan .lbl { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .plan .val { font-size:14px; font-weight:600; }
  .plan .val.tgt { color:var(--bull); }
  .plan .val.stp { color:var(--bear); }

  .reason { font-family:'Poppins',Arial,sans-serif; font-size:11px; color:var(--dim); margin-top:6px; }

  .take-btn { width:100%; padding:12px; margin-top:8px; font-family:'Poppins',Arial,sans-serif;
    font-weight:700; font-size:14px; letter-spacing:.04em; border:none; border-radius:7px;
    color:#fff; background:linear-gradient(135deg, var(--accent), #e88e6f);
    box-shadow:0 4px 12px rgba(217,119,87,.3); min-height:44px; cursor:pointer; }
  .take-btn:active { transform:translateY(1px); }
  .take-btn:disabled { opacity:.5; cursor:wait; }

  .empty { text-align:center; color:var(--mid); font-style:italic; font-size:12px;
    padding:40px 8px; grid-column:1 / -1; }

  /* Universe legend — chips of tickers being scanned */
  .legend {
    margin:14px 0 4px; padding:10px 12px;
    background:var(--panel); border:1px solid var(--hair); border-radius:10px;
  }
  .legend-head {
    font-family:'Poppins',Arial,sans-serif; font-size:10px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .legend-head b { color:var(--ink); font-weight:700; }
  .legend-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip {
    font-family:'Poppins',Arial,sans-serif; font-size:10px; font-weight:600;
    padding:3px 7px; border-radius:3px;
    background:var(--hair); color:var(--dim); letter-spacing:.02em;
  }
  .chip.active { background:var(--accent-soft); color:var(--accent); }
  .chip.trade { background:linear-gradient(135deg, var(--accent), #e88e6f); color:#fff; }

  /* Phase pill in status row */
  .phase-pill {
    font-family:'Poppins',Arial,sans-serif; font-size:10px; font-weight:600;
    letter-spacing:.04em; padding:2px 7px; border-radius:3px; text-transform:uppercase;
  }
  .phase-pill.open { background:rgba(61,124,94,.15); color:var(--bull); }
  .phase-pill.warmup { background:#fef3c7; color:var(--warn); }
  .phase-pill.closed { background:var(--hair); color:var(--mid); }

  .toast { position:fixed; bottom:14px; left:12px; right:12px; padding:12px 16px; border-radius:10px;
    font-family:'Poppins',Arial,sans-serif; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.18);
    z-index:50; opacity:0; transform:translateY(20px); transition:opacity .25s, transform .25s; }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.ok { background:var(--bull); color:#fff; }
  .toast.err { background:var(--bear); color:#fff; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="/" style="opacity:.7"><span>🐂 Conviction</span><span class="sub">engine_v4</span></a>
  <a href="trade.html" class="active"><span>👤 Trade</span><span class="sub">scalp signals</span></a>
  <a href="live.html"><span>💼 Live</span><span class="sub">positions</span></a>
  <a href="auto.html"><span>🤖 Auto</span><span class="sub">paper bot</span></a>
  <a href="review.html"><span>📓 Review</span><span class="sub">EOD analysis</span></a>
  <a href="prebreakout.html"><span>🌱 Pre-Breakout</span><span class="sub">factor stack</span></a>
</nav>

<main>
  <div class="status" id="status">connecting…</div>

  <div class="grid" id="trades">
    <div class="empty">Waiting for setups…</div>
  </div>

  <div class="legend" id="legend" style="display:none">
    <div class="legend-head">
      <span>Universe — <b id="legend-n">0</b> tickers scanned (from latest backtest)</span>
      <span id="legend-meta"></span>
    </div>
    <div class="legend-chips" id="legend-chips"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const fmtPx = n => n == null ? "—" : "$" + Number(n).toFixed(2);
  const ago = iso => {
    if (!iso) return "—";
    const ms = Date.now() - new Date(iso).getTime();
    if (ms < 5000) return "just now";
    if (ms < 60000) return Math.floor(ms/1000) + "s";
    if (ms < 3_600_000) return Math.floor(ms/60000) + "m";
    return Math.floor(ms/3_600_000) + "h";
  };

  function toast(msg, kind = "ok") {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show " + kind;
    setTimeout(() => t.classList.remove("show"), 3500);
  }

  function renderStatus(s) {
    const phase = s.phase || (s.market_open ? "open" : "closed");
    const phasePill = `<span class="phase-pill ${phase}">${phase === "warmup" ? "warm-up" : phase}</span>`;
    const scanning = s.running ? "scanning" : "stopped";
    const last = s.last_tick_at ? `· tick ${ago(s.last_tick_at)}` : "";
    const auto = s.auto_submit ? "· AUTO" : "";
    const n = (s.setups || []).length;
    $("status").innerHTML = `
      <span class="dot ${s.running ? "on" : "off"}"></span>
      ${scanning} ${phasePill} ${last} ${auto} · <b>${n}</b> setup${n === 1 ? "" : "s"}
    `;
  }

  function renderLegend(s) {
    const tickers = s.tickers || [];
    if (!tickers.length) {
      $("legend").style.display = "none";
      return;
    }
    $("legend").style.display = "block";
    $("legend-n").textContent = tickers.length;
    // active set = tickers that currently have a setup
    const active = new Map((s.setups || []).map(x => [x.ticker, x.stage]));
    $("legend-chips").innerHTML = tickers.map(t => {
      const stage = active.get(t);
      const cls = stage === "TRADE" ? "trade" : stage === "FORMING" ? "active" : "";
      return `<span class="chip ${cls}" title="${stage || 'idle'}">${t}</span>`;
    }).join("");
    const formingN = [...active.values()].filter(v => v === "FORMING").length;
    const tradeN = [...active.values()].filter(v => v === "TRADE").length;
    $("legend-meta").innerHTML = (formingN || tradeN)
      ? `<b>${tradeN}</b> trade · <b>${formingN}</b> forming`
      : `<span style="opacity:.6">all idle</span>`;
  }

  function renderTrades(setups) {
    const host = $("trades");
    if (!setups || !setups.length) {
      host.innerHTML = `<div class="empty">No setups right now. Daemon scans every 60s — cards appear when a ticker enters a trigger state.</div>`;
      return;
    }
    host.innerHTML = setups.map(s => {
      const stageCls = s.stage === "TRADE" ? "trade" : "forming";
      const stageEmoji = s.stage === "TRADE" ? "⚡" : "🌿";
      const dir = (s.direction || "").toLowerCase();
      const dirEmoji = dir === "long" ? "🐂" : "🐻";
      const reason = s.stage === "FORMING"
        ? `⏳ ${(s.pass_reason || "").replace(/_/g, " ")}`
        : `⚡ all gates passed`;
      const takeBtn = s.stage === "TRADE"
        ? `<button class="take-btn" data-id="${s.id}" data-tk="${s.ticker}">⚡ TAKE — ${s.qty}× ${s.ticker} ${dir.toUpperCase()}</button>`
        : "";
      // Format "fired Xs/Xm/Xh ago" with absolute UTC time on hover
      const created = s.created_at;
      const fmtCreated = created
        ? `<span class="signal-time" title="${created}">⌚ fired ${ago(created)} ago</span>`
        : "";
      return `<div class="card ${stageCls}">
        <div class="card-head">
          <span class="tick">${s.ticker}</span>
          <span class="stage ${stageCls}">${stageEmoji} ${s.stage}</span>
          <span class="strat">${s.strategy}</span>
          <span class="dir ${dir}">${dirEmoji} ${dir.toUpperCase()}</span>
          ${fmtCreated}
        </div>
        <div class="plan">
          <div><span class="lbl">Entry</span><span class="val">${fmtPx(s.entry)}</span></div>
          <div><span class="lbl">Stop</span><span class="val stp">${fmtPx(s.stop)}</span></div>
          <div><span class="lbl">Target</span><span class="val tgt">${fmtPx(s.target)}</span></div>
        </div>
        <div class="reason">${reason}</div>
        ${takeBtn}
      </div>`;
    }).join("");
    document.querySelectorAll(".take-btn").forEach(b => {
      b.addEventListener("click", async () => {
        const id = b.dataset.id;
        const tk = b.dataset.tk;
        if (!confirm(`Take ${tk}?\nSubmits paper bracket order.`)) return;
        b.disabled = true; b.textContent = "submitting…";
        try {
          const r = await fetch("api/take", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({id}),
          });
          const d = await r.json();
          if (!d.ok) {
            toast("FAILED: " + (d.error || "unknown"), "err");
            b.disabled = false; b.textContent = `⚡ TAKE ${tk}`;
          } else {
            toast(`✓ ${tk} submitted`, "ok");
            pull();
          }
        } catch (e) {
          toast("FAILED: " + e, "err");
          b.disabled = false; b.textContent = `⚡ TAKE ${tk}`;
        }
      });
    });
  }

  async function pull() {
    try {
      // /api/daemon/status includes tickers (universe) + setups + phase
      const r = await fetch("api/daemon/status", {cache:"no-store"});
      const s = await r.json();
      renderStatus(s);
      renderTrades(s.setups);
      renderLegend(s);
    } catch (e) { console.warn("pull failed", e); }
  }

  pull();
  setInterval(pull, 3000);
</script>

</body>
</html>
