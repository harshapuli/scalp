<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scalp 2 — auto trader</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#141413; --bg:#faf9f5; --panel:#fff; --hair:#e8e6dc;
    --dim:#6b6a65; --mid:#b0aea5;
    --accent:#d97757; --accent-soft:#fceee7;
    --bull:#3d7c5e; --bear:#b03528; --warn:#a16207;
    --bull-soft:#e7ece0; --bear-soft:#f9e0dd; --warn-soft:#fef3c7;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 'Lora',Georgia,serif; background:var(--bg); color:var(--ink); }
  h1, h2, .poppins { font-family:'Poppins',Arial,sans-serif; }
  .topnav {
    position:sticky; top:0; z-index:20;
    display:flex; gap:4px; padding:10px 14px;
    background:var(--bg); border-bottom:1px solid var(--hair);
  }
  .topnav a {
    font-family:'Poppins',Arial,sans-serif;
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; font-size:13px; font-weight:500;
    color:var(--dim); text-decoration:none;
    border-radius:999px; border:1px solid transparent;
  }
  .topnav a:hover { color:var(--ink); background:var(--hair); }
  .topnav a.active { color:var(--ink); background:var(--accent-soft); border-color:rgba(217,119,87,0.3); }
  .topnav a .sub { font-size:10px; color:var(--mid); font-weight:400; }
  .topnav a.active .sub { color:var(--accent); }

  main { max-width:1100px; margin:0 auto; padding:18px 16px 36px; }
  h1 { font-size:24px; color:var(--accent); margin:6px 0 14px; font-weight:700; }
  h2 { font-size:15px; margin:24px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--hair); }

  .control-panel {
    background:var(--panel); border:1px solid var(--hair); border-radius:12px;
    padding:18px 20px; margin-bottom:14px;
  }
  .status-banner {
    border-radius:10px; padding:18px 22px; margin-bottom:14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .status-banner.running {
    background:linear-gradient(135deg, var(--bull) 0%, #5fad84 100%); color:#fff;
    box-shadow:0 4px 14px rgba(61,124,94,0.25);
  }
  .status-banner.stopped {
    background:var(--hair); color:var(--ink); border:1px solid var(--mid);
  }
  .status-banner.error {
    background:linear-gradient(135deg, var(--bear) 0%, #d04638 100%); color:#fff;
  }
  .dot { width:14px; height:14px; border-radius:50%; }
  .dot.running { background:#4d9b75; box-shadow:0 0 12px rgba(255,255,255,0.6); animation:pulse 1.5s infinite; }
  .dot.stopped { background:var(--mid); }
  .dot.error { background:#ffd; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

  .status-text { font-family:'Poppins',Arial,sans-serif; font-weight:700; font-size:22px; letter-spacing:.02em; }
  .status-meta { font-size:13px; opacity:.85; }

  .control-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .ctrl-btn {
    padding:10px 22px; font-family:'Poppins',Arial,sans-serif;
    font-weight:700; font-size:13px; letter-spacing:.06em;
    border:none; border-radius:6px; cursor:pointer; color:#fff;
  }
  .ctrl-btn.start { background:linear-gradient(135deg, var(--bull), #4d9b75); }
  .ctrl-btn.stop { background:linear-gradient(135deg, var(--bear), #8d2920); }
  .ctrl-btn:disabled { opacity:.4; cursor:wait; }

  .config-row { display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-top:14px; }
  label { display:block; font-family:'Poppins',Arial,sans-serif; font-size:11px;
          color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  input[type=text], input[type=number] {
    width:100%; padding:8px 12px; font-size:14px; font-family:'Lora',Georgia,serif;
    border:1px solid var(--hair); border-radius:6px; background:#fff;
  }

  /* Decisions feed */
  table { width:100%; border-collapse:collapse; background:#fff;
          border:1px solid var(--hair); border-radius:8px; overflow:hidden; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--hair); font-size:12px; text-align:left; }
  th { background:#f5f4ee; font-family:'Poppins',Arial,sans-serif; font-weight:600;
       text-transform:uppercase; letter-spacing:.04em; font-size:10px; color:var(--dim); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th.num { text-align:right; }
  tr:hover { background:var(--bg); }
  code { font-family:'SF Mono',Menlo,Monaco,monospace; font-size:11px;
         background:var(--hair); padding:1px 6px; border-radius:3px; }
  .badge-trade { background:var(--bull); color:#fff; padding:2px 8px; border-radius:4px;
                  font-family:'Poppins',Arial,sans-serif; font-size:10px; font-weight:700;
                  letter-spacing:.04em; }
  .badge-pass { background:var(--hair); color:var(--dim); padding:2px 8px; border-radius:4px;
                 font-family:'Poppins',Arial,sans-serif; font-size:10px; font-weight:600; }
  .badge-error { background:var(--bear); color:#fff; padding:2px 8px; border-radius:4px;
                  font-family:'Poppins',Arial,sans-serif; font-size:10px; font-weight:700; }
  .dir-long { color:var(--bull); font-weight:600; font-size:10px; }
  .dir-short { color:var(--bear); font-weight:600; font-size:10px; }

  .toast { position:fixed; top:60px; right:14px; padding:12px 18px; border-radius:8px;
           font-family:'Poppins',Arial,sans-serif; font-size:13px; max-width:340px;
           box-shadow:0 4px 14px rgba(0,0,0,0.15); z-index:50; opacity:0; transition:opacity .25s; }
  .toast.show { opacity:1; }
  .toast.ok { background:var(--bull); color:#fff; }
  .toast.err { background:var(--bear); color:#fff; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="/trade.html"><span>👤 Trade</span><span class="sub">manual entry</span></a>
  <a href="/auto.html" class="active"><span>🤖 Auto</span><span class="sub">paper bot</span></a>
</nav>

<main>
  <h1>Auto trader · scalp 2 daemon</h1>

  <div class="status-banner stopped" id="status-banner">
    <div class="dot stopped" id="status-dot"></div>
    <div>
      <div class="status-text" id="status-text">CHECKING…</div>
      <div class="status-meta" id="status-meta">contacting /api/daemon/status</div>
    </div>
  </div>

  <div class="control-panel">
    <div class="config-row">
      <div>
        <label>Universe (comma-separated)</label>
        <input type="text" id="tickers" value="SPY,QQQ,NVDA,AAPL,TSLA,META,AMD,MSFT" autocomplete="off">
      </div>
      <div>
        <label>Poll interval (s)</label>
        <input type="number" id="poll_seconds" value="60" min="15" max="300" step="15">
      </div>
    </div>
    <div class="control-row">
      <button class="ctrl-btn start" id="start-btn">▶ START DAEMON</button>
      <button class="ctrl-btn stop" id="stop-btn" disabled>■ STOP DAEMON</button>
      <span style="color:var(--dim); font-size:12px;">
        Each tick: pull 50× 1m bars per ticker, classify scalp state,
        evaluate strategy gates, fire bracket order on TRADE.
      </span>
    </div>
  </div>

  <h2>Recent decisions</h2>
  <div id="decisions-host"></div>

  <h2>Daemon-placed orders</h2>
  <div id="orders-host"></div>

</main>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  function toast(msg, kind = "ok") {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show " + kind;
    setTimeout(() => t.classList.remove("show"), 3500);
  }

  function fmtAgo(iso) {
    if (!iso) return "—";
    const ms = Date.now() - new Date(iso).getTime();
    if (ms < 5_000) return "just now";
    if (ms < 60_000) return Math.floor(ms / 1000) + "s ago";
    if (ms < 3_600_000) return Math.floor(ms / 60_000) + "m ago";
    return Math.floor(ms / 3_600_000) + "h ago";
  }

  function renderStatus(s) {
    const banner = $("status-banner");
    const dot = $("status-dot");
    if (s.error) {
      banner.className = "status-banner error";
      dot.className = "dot error";
      $("status-text").textContent = "ERROR";
      $("status-meta").textContent = s.error;
    } else if (s.running) {
      banner.className = "status-banner running";
      dot.className = "dot running";
      const mkt = s.market_open ? "market open" : "market closed (sleeping)";
      $("status-text").textContent = "● RUNNING";
      $("status-meta").textContent = `${s.tickers.length} tickers · poll ${s.poll_seconds}s · ${mkt} · last tick ${fmtAgo(s.last_tick_at)}`;
      $("start-btn").disabled = true;
      $("stop-btn").disabled = false;
    } else {
      banner.className = "status-banner stopped";
      dot.className = "dot stopped";
      $("status-text").textContent = "■ STOPPED";
      $("status-meta").textContent = s.stopped_at ? `stopped ${fmtAgo(s.stopped_at)}` : "click Start to begin";
      $("start-btn").disabled = false;
      $("stop-btn").disabled = true;
    }
  }

  function renderDecisions(decisions) {
    const host = $("decisions-host");
    if (!decisions || !decisions.length) {
      host.innerHTML = `<div style="color:var(--mid); font-style:italic; padding:18px 0;">No decisions yet.</div>`;
      return;
    }
    const rows = decisions.map(d => {
      let badge;
      if (d.decision === "TRADE") badge = `<span class="badge-trade">⚡ TRADE</span>`;
      else if (d.decision === "ERROR") badge = `<span class="badge-error">ERR</span>`;
      else badge = `<span class="badge-pass">PASS</span>`;
      const dirCls = d.direction === "long" ? "dir-long" : d.direction === "short" ? "dir-short" : "";
      return `<tr>
        <td class="small">${(d.ts || "").substring(11, 19)}</td>
        <td><b>${d.ticker || "?"}</b></td>
        <td>${d.strategy || "—"}</td>
        <td><span class="${dirCls}">${(d.direction || "").toUpperCase()}</span></td>
        <td>${d.state || "—"}</td>
        <td class="num">${d.score != null ? Number(d.score).toFixed(2) : "—"}</td>
        <td>${badge}</td>
        <td class="small" style="color:var(--dim)">${d.reason || ""}</td>
      </tr>`;
    }).join("");
    host.innerHTML = `<table>
      <thead><tr>
        <th>UTC</th><th>Ticker</th><th>Strat</th><th>Dir</th>
        <th>State</th><th class="num">Score</th><th>Decision</th><th>Reason</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderOrders(orders) {
    const host = $("orders-host");
    if (!orders || !orders.length) {
      host.innerHTML = `<div style="color:var(--mid); font-style:italic; padding:18px 0;">No orders placed yet.</div>`;
      return;
    }
    const rows = orders.map(o => {
      if (o.error) return `<tr>
        <td class="small">${(o.ts || "").substring(11, 19)}</td>
        <td><b>${o.ticker}</b></td>
        <td>${o.side}</td>
        <td colspan="5"><span class="badge-error">ERR ${o.error}</span></td>
      </tr>`;
      return `<tr>
        <td class="small">${(o.ts || "").substring(11, 19)}</td>
        <td><b>${o.ticker}</b></td>
        <td><span class="${o.side === 'BUY' ? 'dir-long' : 'dir-short'}">${o.side}</span></td>
        <td class="num">${o.qty}</td>
        <td class="num">$${Number(o.entry || 0).toFixed(2)}</td>
        <td class="num">$${Number(o.stop || 0).toFixed(2)}</td>
        <td class="num">$${Number(o.target || 0).toFixed(2)}</td>
        <td><code>${(o.order_id || "").slice(0, 10)}…</code></td>
      </tr>`;
    }).join("");
    host.innerHTML = `<table>
      <thead><tr>
        <th>UTC</th><th>Ticker</th><th>Side</th><th class="num">Qty</th>
        <th class="num">Entry</th><th class="num">Stop</th><th class="num">Target</th><th>Order</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  async function pullStatus() {
    try {
      const r = await fetch("/api/daemon/status");
      const s = await r.json();
      renderStatus(s);
      renderDecisions(s.decisions);
      renderOrders(s.orders);
    } catch (e) {
      console.warn("status fetch failed", e);
    }
  }

  $("start-btn").addEventListener("click", async () => {
    const tickers = ($("tickers").value || "").split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
    const poll = parseInt($("poll_seconds").value || "60", 10);
    if (!tickers.length) return toast("Enter at least one ticker", "err");
    $("start-btn").disabled = true;
    try {
      const r = await fetch("/api/daemon/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({tickers, poll_seconds: poll}),
      });
      const d = await r.json();
      if (d.error) toast("Start failed: " + d.error, "err");
      else toast(`Daemon started · ${tickers.length} tickers · poll ${poll}s`, "ok");
    } catch (e) {
      toast("Start failed: " + e, "err");
    }
    pullStatus();
  });

  $("stop-btn").addEventListener("click", async () => {
    if (!confirm("Stop the auto-trader?\n(Open positions stay — close them manually if needed.)")) return;
    $("stop-btn").disabled = true;
    try {
      const r = await fetch("/api/daemon/stop", {method: "POST"});
      const d = await r.json();
      if (d.error) toast("Stop failed: " + d.error, "err");
      else toast("Daemon stopped", "ok");
    } catch (e) {
      toast("Stop failed: " + e, "err");
    }
    pullStatus();
  });

  pullStatus();
  setInterval(pullStatus, 3000);
</script>

</body>
</html>
