[project]
name = "scalp2"
version = "0.2.0"
description = "Edge-Centric Trading System v2.2 — Foundation + Scalp Brain + Swing Brain + S5"
readme = "DESIGN.md"
requires-python = ">=3.9"

dependencies = [
    "httpx >= 0.25",
    "pyyaml >= 6.0",
    "numpy >= 1.24",
    "scikit-learn >= 1.3",
    "scipy >= 1.10",
    "pandas >= 2.0",
    "redis >= 5.0",
    "asyncpg >= 0.29",
    "websockets >= 12.0",
    "aiohttp >= 3.9",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.4",
    "pytest-asyncio >= 0.23",
    "alembic >= 1.13",
]
ml-extras = [
    "lightgbm >= 4.0",
    "optuna >= 3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
